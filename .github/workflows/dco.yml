# Checks that every commit in a pull request has a "Signed-off-by:" line (Developer Certificate of Origin).
# See CONTRIBUTING.md for how to sign off.
name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+>'; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with 'git commit -s'. To fix every commit on this branch: git rebase --signoff $BASE && git push --force-with-lease"
            echo "See CONTRIBUTING.md (Sign your commits)."
            exit 1
          fi
          echo "All commits are signed off."
